# 持续集成（CI）：代码 push 到 master 或有人提 PR 时自动运行。
# 每个 job 是一次独立的完整运行，多个 job 默认并行；任何一个失败，这次运行就是失败的。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 最小权限：流水线只需要读代码，不给写仓库的权限
permissions:
  contents: read

# 同一分支有新推送时，取消还在跑的旧任务，避免浪费 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 格式、静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # Go 版本以 go.mod 为准，避免两处维护不一致
          cache: true # 缓存依赖下载和构建结果，加快后续每次运行

      - name: 运行 make ci
        run: make ci # 和本地手动验收用的是同一套命令

  race:
    name: 竞态检测
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 秒杀和 Feed 都有并发逻辑，用竞态检测器跑一遍比单测更能发现问题。
      # 需要 CGO，CI 的 Linux runner 自带 gcc；本地 Windows 下要额外装 C 编译器才能跑。
      - name: 运行 make test-race
        run: make test-race
